[project]
name = "42api"
version = "0.1.0"
description = "Object-oriented Python client for the 42 School API (api.intra.42.fr)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Dan", email = "danyridolfo98@gmail.com" }]
dependencies = ["httpx>=0.27", "pydantic>=2.0"]

[project.urls]
Homepage = "https://github.com/Shadowaker/42api"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
    "unasync>=0.6",
    "pre-commit>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/intra42"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
packages = ["intra42"]
mypy_path = "src"
disallow_untyped_defs = true
warn_unused_ignores = true
